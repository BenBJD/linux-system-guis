[project]
name = "sysctl-gui"
version = "0.1.0"
description = "Interactive Linux kernel parameter tuner and sysctl.d manager"
requires-python = ">=3.12"
dependencies = [
    "linux-gui-core",
]

[project.scripts]
sysctl-gui = "sysctl_gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sysctl_gui"]
