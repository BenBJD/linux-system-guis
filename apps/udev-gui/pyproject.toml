[project]
name = "udev-gui"
version = "0.1.0"
description = "Interactive udev rules builder, manager, and reload assistant"
requires-python = ">=3.12"
dependencies = [
    "linux-gui-core",
]

[project.scripts]
udev-gui = "udev_gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/udev_gui"]
