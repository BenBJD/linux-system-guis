[project]
name = "fstab-gui"
version = "0.1.0"
description = "Interactive, educational /etc/fstab entry manager and live previewer"
requires-python = ">=3.12"
dependencies = [
    "linux-gui-core",
]

[project.scripts]
fstab-gui = "fstab_gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fstab_gui"]
