[project]
name = "permissions-gui"
version = "0.1.0"
description = "Interactive Advanced Linux File Permissions manager (ACLs via setfacl/getfacl and Attributes via chattr/lsattr)"
requires-python = ">=3.12"
dependencies = [
    "linux-gui-core",
]

[project.scripts]
permissions-gui = "permissions_gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/permissions_gui"]
