[project]
name = "device-gui"
version = "0.1.0"
description = "Modern visual device manager and hardware inspector for Linux"
requires-python = ">=3.12"
dependencies = [
    "linux-gui-core",
]

[project.scripts]
device-gui = "device_gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/device_gui"]
