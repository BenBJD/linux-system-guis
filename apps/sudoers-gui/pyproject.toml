[project]
name = "sudoers-gui"
version = "0.1.0"
description = "Safe and educational /etc/sudoers and sudoers.d configuration manager with visudo validation"
requires-python = ">=3.12"
dependencies = [
    "linux-gui-core",
]

[project.scripts]
sudoers-gui = "sudoers_gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sudoers_gui"]
