[project]
name = "journal-gui"
version = "0.1.0"
description = "Interactive systemd journal log explorer and maintenance assistant"
requires-python = ">=3.12"
dependencies = [
    "linux-gui-core",
]

[project.scripts]
journal-gui = "journal_gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/journal_gui"]
