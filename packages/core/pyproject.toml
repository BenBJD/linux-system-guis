[project]
name = "linux-gui-core"
version = "0.1.0"
description = "Shared UI components, live preview banners, diff inspectors, and safe executors for Linux system GUIs"
requires-python = ">=3.12"
dependencies = [
    "pyqt6>=6.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linux_gui_core"]
